name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_pipeline test_workflows test_conversation test_classifier_split test_audio_cache test_llm_grounding test_llm_training test_trained_llm test_review_integrity test_questions test_question_semantics test_preparation_study test_ui test_calls_depth test_decisions_depth test_qa_review test_assistant_depth
